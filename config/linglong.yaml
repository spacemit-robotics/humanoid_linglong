                       0.1, 0.1,
                       0.5, 0.5, 0.5, 0.5, 0.2, 0.2, 0.2,
                       0.5, 0.5, 0.5, 0.5, 0.2, 0.2, 0.2]
        clip_actions: []
        clip_observations: []
