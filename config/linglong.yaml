             150, 50, 50, 30, 10, 10, 10]
        kd: [14, 12, 5, 14, 5, 5,
             14, 12, 5, 14, 5, 5,
             1.5, 1.5,
             3, 1.5, 1.5, 5, 1, 1, 1,
             3, 1.5, 1.5, 5, 1, 1, 1]
        custom_array_dims:
