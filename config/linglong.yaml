                         0.15, -0.25, 0.0, 1.15, 0.0, 0.0, 0.0]
        # ZERO 使用参考首帧；rl_default_pos 保持训练时的动作/观测基准。
        zero_target_pos: [-0.258088708, 0.071932591, 0.223078296, 0.250872612, -0.172092855, -0.085270785,
                         -0.258088708, -0.071932591, -0.223078296, 0.250872612, -0.172092855, 0.085270785,
                          0.0, 0.0,
                         -0.189165130, 0.268211037, -0.592248619, 1.122644663, 0.028424067, 0.094449162, 0.017718747,
                         -0.189165130, -0.268211037, 0.592248619, 1.122644663, -0.028424067, 0.094449162, -0.017718747]
        kp: [280, 240, 100, 280, 100, 50,
