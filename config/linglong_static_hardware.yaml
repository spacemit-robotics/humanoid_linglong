# Fixed-base display: arms only; no leg/head actuation or IMU.
schema_version: 2
whole_body:
  cycle_s: 0.002
  startup_feedback_timeout_s: 1.5
  feedback_timeout_s: 0.04
  command_timeout_s: 0.1
  require_motor_receive_timestamps: true
  startup_mode: disabled
  allow_actuation: true
  buses:
  - {name: arm_left, type: socketcan, device: can2, bitrate: 1000000}
  - {name: arm_right, type: socketcan, device: can3, bitrate: 1000000}
  motors:
  - name: motor_alias_13
    driver: drv_can_dm
    bus: arm_left
    model: Damiao DM-J6248P-2EC
    command_id: 1
    feedback_id: 17
    polarity: 1
    zero_offset: 0.0
    command_limits: &id001 {kp_max: 500.0, kd_max: 5.0, estimated_torque_max: 120.0}
    driver_options: &id002
      enable_on_init: false
      feedback_period_us: 1000
      protocol_limits:
        position: [-12.566, 12.566]
        velocity: [-20.0, 20.0]
        torque: [-120.0, 120.0]
        kp: [0.0, 500.0]
        kd: [0.0, 5.0]
