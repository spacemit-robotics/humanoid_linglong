    - {name: right_elbow_joint, mapping: direct, motors: [motor_alias_23], position_limit: [-0.785398163, 1.570796327], velocity_limit: 10.47, torque_limit: 27.0}
    - {name: right_wrist_roll_joint, mapping: direct, motors: [motor_alias_24], position_limit: [-2.967059728, 2.967059728], velocity_limit: 20.94, torque_limit: 7.0}
    - {name: right_wrist_pitch_joint, mapping: direct, motors: [motor_alias_25], position_limit: [-1.396263402, 1.396263402], velocity_limit: 20.94, torque_limit: 7.0}
    - {name: right_wrist_yaw_joint, mapping: direct, motors: [motor_alias_26], position_limit: [-1.396263402, 1.396263402], velocity_limit: 20.94, torque_limit: 7.0}

  couplings:
    # Both ankles use the same parallel-linkage orientation.
    - type: parallel_ankle
      joints: [left_ankle_pitch_joint, left_ankle_roll_joint]
      motors: [motor_alias_5, motor_alias_6]
      ankle_pivots: [[-0.066, 0.03575, 0.0], [-0.066, -0.03575, 0.0]]
      ball_positions: [[-0.066, 0.046, 0.297], [-0.066, -0.046, 0.186]]
      motor_positions: [[0.0, 0.046, 0.297], [0.0, -0.046, 0.186]]
      motor_bias: [0.0, 0.0]
      motor_limit: 1.5
      ankle_limit: 1.5
      motor_difference_limit: 1.3
      max_iterations: 50
      squared_tolerance: 1.0e-10
    - type: parallel_ankle
      joints: [right_ankle_pitch_joint, right_ankle_roll_joint]
      motors: [motor_alias_11, motor_alias_12]
      ankle_pivots: [[-0.066, 0.03575, 0.0], [-0.066, -0.03575, 0.0]]
      ball_positions: [[-0.066, 0.046, 0.297], [-0.066, -0.046, 0.186]]
      motor_positions: [[0.0, 0.046, 0.297], [0.0, -0.046, 0.186]]
      motor_bias: [0.0, 0.0]
      motor_limit: 1.5
      ankle_limit: 1.5
      motor_difference_limit: 1.3
      max_iterations: 50
      squared_tolerance: 1.0e-10

  imu:
    driver: drv_uart_forsense
    device: /dev/ttyUSB0
    baud: 460800
    mounting_matrix: [0.0, 0.9999955, -0.002999996,
                      -1.0, 0.0, 0.0,
                      0.0, 0.002999996, 0.9999955]
    acceleration_bias: [0.0, 0.0, 0.0]
    gyro_bias: [0.0, 0.0, 0.0]
