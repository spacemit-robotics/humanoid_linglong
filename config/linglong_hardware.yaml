# LingLong L1 V1.4 whole-body runtime configuration.
# Motor calibration values are specific to this robot instance and must be
# recalibrated before use on another robot.

schema_version: 2
whole_body:
  # 500 Hz hardware control period.
  cycle_s: 0.002
  # Initial feedback collection window.
  startup_feedback_timeout_s: 1.5
  # Maximum tolerated age for asynchronous CAN and IMU feedback.
  feedback_timeout_s: 0.04
  command_timeout_s: 0.1
  # Opens devices in protocol-disabled state. Only explicit FSM commands may enable motors.
  startup_mode: disabled
  allow_actuation: true

  buses:
    - {name: leg_left, type: socketcan, device: can0, bitrate: 1000000}
    - {name: leg_right, type: socketcan, device: can1, bitrate: 1000000}
    - {name: arm_left, type: socketcan, device: can2, bitrate: 1000000}
    - {name: arm_right, type: socketcan, device: can3, bitrate: 1000000}
    - {name: head, type: socketcan, device: can4, bitrate: 1000000}

  motors:
    - name: motor_alias_1
      driver: drv_can_encos
      bus: leg_left
      model: "Encos EC-A10020-P2-24"
      command_id: 1
      feedback_id: 1
      polarity: 1
      zero_offset: -0.0070572975
      driver_options: &encos_a10020_p2_24
        enable_on_init: false
        protocol_limits:
          position: [-12.5, 12.5]
          velocity: [-18.0, 18.0]
          torque: [-300.0, 300.0]
          kp: [0.0, 500.0]
          kd: [0.0, 50.0]
    - name: motor_alias_2
      driver: drv_can_encos
      bus: leg_left
      model: "Encos EC-A8116-P1-18"
