  # Order is the SDK/URDF/policy canonical joint order from linglong.yaml.
  joints:
    - {name: left_hip_pitch_joint, mapping: direct, motors: [motor_alias_1], position_limit: [-1.570796327, 0.785398163], velocity_limit: 12.8805, torque_limit: 300.0}
    - {name: left_hip_roll_joint, mapping: direct, motors: [motor_alias_2], position_limit: [-0.34906585, 0.785398163], velocity_limit: 14.6608, torque_limit: 150.0, impedance: {mode: split, motor_kp_max: 500.0, motor_kd_max: 5.0}}
    - {name: left_hip_yaw_joint, mapping: direct, motors: [motor_alias_3], position_limit: [-2.094395102, 2.138028334], velocity_limit: 14.6608, torque_limit: 130.0}
    - {name: left_knee_joint, mapping: direct, motors: [motor_alias_4], position_limit: [-0.174532925, 1.902408885], velocity_limit: 14.6608, torque_limit: 150.0}
    - {name: left_ankle_pitch_joint, mapping: parallel_ankle, motors: [motor_alias_5, motor_alias_6], position_limit: [-0.802851456, 0.602138592], velocity_limit: 16.441, torque_limit: 90.0}
    - {name: left_ankle_roll_joint, mapping: parallel_ankle, motors: [motor_alias_5, motor_alias_6], position_limit: [-0.52, 0.52], velocity_limit: 16.441, torque_limit: 90.0}
    - {name: right_hip_pitch_joint, mapping: direct, motors: [motor_alias_7], position_limit: [-1.570796327, 0.785398163], velocity_limit: 12.8805, torque_limit: 300.0}
    - {name: right_hip_roll_joint, mapping: direct, motors: [motor_alias_8], position_limit: [-0.785398163, 0.34906585], velocity_limit: 14.6608, torque_limit: 150.0, impedance: {mode: split, motor_kp_max: 500.0, motor_kd_max: 5.0}}
    - {name: right_hip_yaw_joint, mapping: direct, motors: [motor_alias_9], position_limit: [-2.138028334, 2.094395102], velocity_limit: 14.6608, torque_limit: 130.0}
    - {name: right_knee_joint, mapping: direct, motors: [motor_alias_10], position_limit: [-0.174532925, 1.902408885], velocity_limit: 14.6608, torque_limit: 150.0}
    - {name: right_ankle_pitch_joint, mapping: parallel_ankle, motors: [motor_alias_11, motor_alias_12], position_limit: [-0.802851456, 0.602138592], velocity_limit: 16.441, torque_limit: 90.0}
    - {name: right_ankle_roll_joint, mapping: parallel_ankle, motors: [motor_alias_11, motor_alias_12], position_limit: [-0.52, 0.52], velocity_limit: 16.441, torque_limit: 90.0}
    - {name: head_yaw_joint, mapping: direct, motors: [motor_alias_30], position_limit: [-1.570796327, 1.570796327], velocity_limit: 10.47197551, torque_limit: 10.0}
    - {name: head_pitch_joint, mapping: direct, motors: [motor_alias_31], position_limit: [-0.785398163, 0.785398163], velocity_limit: 10.47197551, torque_limit: 10.0}
    - {name: left_shoulder_pitch_joint, mapping: direct, motors: [motor_alias_13], position_limit: [-2.967059728, 2.967059728], velocity_limit: 6.28, torque_limit: 75.0}
    - {name: left_shoulder_roll_joint, mapping: direct, motors: [motor_alias_14], position_limit: [-0.087266463, 3.054326191], velocity_limit: 6.28, torque_limit: 80.0}
    - {name: left_shoulder_yaw_joint, mapping: direct, motors: [motor_alias_15], position_limit: [-2.967059728, 2.967059728], velocity_limit: 10.47, torque_limit: 27.0}
    - {name: left_elbow_joint, mapping: direct, motors: [motor_alias_16], position_limit: [-0.785398163, 1.570796327], velocity_limit: 10.47, torque_limit: 27.0}
    - {name: left_wrist_roll_joint, mapping: direct, motors: [motor_alias_17], position_limit: [-2.967059728, 2.967059728], velocity_limit: 20.94, torque_limit: 7.0}
    - {name: left_wrist_pitch_joint, mapping: direct, motors: [motor_alias_18], position_limit: [-1.396263402, 1.396263402], velocity_limit: 20.94, torque_limit: 7.0}
    - {name: left_wrist_yaw_joint, mapping: direct, motors: [motor_alias_19], position_limit: [-1.396263402, 1.396263402], velocity_limit: 20.943, torque_limit: 7.0}
    - {name: right_shoulder_pitch_joint, mapping: direct, motors: [motor_alias_20], position_limit: [-2.967059728, 2.967059728], velocity_limit: 6.28, torque_limit: 75.0}
    - {name: right_shoulder_roll_joint, mapping: direct, motors: [motor_alias_21], position_limit: [-3.054326191, 0.087266463], velocity_limit: 6.28, torque_limit: 80.0}
